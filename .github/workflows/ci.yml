name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Gofmt
        # Three test files had silently drifted out of gofmt; nothing in CI
        # noticed, because vet does not check formatting. gofmt -l prints the
        # offenders and says nothing when the tree is clean, so fail on any
        # output rather than on an exit code it never sets.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      # The native window loop now lives in go-widgets/application (the reader no
      # longer carries its own internal/window package). cmd/bundle is build
      # tooling around go-macos/appbundle.
      # internal/sourceplugin/grpc + internal/mediacacheplugin/grpc are generated
      # protobuf/gRPC code and internal/sourceplugin/transport +
      # internal/mediacacheplugin/transport are the hashicorp/go-plugin subprocess
      # glue; these are boundaries that cannot reach 100% line
      # coverage in-process, so they are excluded from the gate (their logic — the
      # Item/Cache <-> proto mapping and the hosts' scan/adapter — lives in the
      # gated protoconv, sourceplugin, mediacache and mediacacheplugin packages,
      # tested to 100%, and the whole path is exercised end-to-end by building and
      # launching cmd/example-source-plugin + cmd/example-mediacache-plugin).
      - name: Test with coverage (all packages except the window boundary and the plugin transports)
        run: go test -covermode=set -coverprofile=cover.out $(go list ./... | grep -vE '/(internal/(window|sourceplugin/grpc|sourceplugin/transport|mediacacheplugin/grpc|mediacacheplugin/transport)|cmd/(example-source-plugin|example-mediacache-plugin|bundle))($|/)')
      - name: Enforce 100% coverage
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 < 100.0) ? 1 : 0 }' \
            || { echo "coverage ${pct}% < 100%"; go tool cover -func=cover.out | grep -v '100.0%'; exit 1; }

  race:
    # The native-window front-end aggregates on a background goroutine while the
    # render thread draws; the scene-write marshaling (app.App.DeferSceneWrites)
    # keeps that data-race-free. Guard it so it can't regress. -race needs the
    # race runtime, which requires cgo, so this job runs with CGO enabled on
    # linux/amd64 (the coverage gate above stays CGO=0, since -race is
    # incompatible with -covermode=set). The window boundary is excluded here as
    # in the coverage gate.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Test with the race detector (all packages except the window boundary)
        run: go test -race -timeout 20m $(go list ./... | grep -vE '/(internal/(window|sourceplugin/grpc|sourceplugin/transport|mediacacheplugin/grpc|mediacacheplugin/transport)|cmd/(example-source-plugin|example-mediacache-plugin|bundle))($|/)')

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # Android is a real target since go-widgets/window v0.44.0: Open dials the
          # go-widgets/android host inside an APK, and falls through to X11/Wayland
          # under Termux. arm64 is the ONLY Android arch Go links CGO-free, which is
          # the whole premise of a CGO=0 build.
          - { goos: android, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./...
      # Compile-check the macOS menu-bar tray backend (NSStatusItem via purego),
      # which only links under -tags tray_native, so the tray integration can't
      # rot unnoticed.
      - name: Build darwin tray backend (-tags tray_native)
        if: matrix.target.goos == 'darwin'
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -tags tray_native ./...
