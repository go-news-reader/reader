name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Vet
        run: go vet ./...
      # internal/window opens a real OS window and pumps a native event loop
      # (Cocoa / win32 / X11) — a launch-verified boundary that cannot be
      # exercised headless, so its per-OS Run is excluded from the coverage gate
      # (its pure seam helpers are still unit-tested in window_seam_test.go, and
      # it is still vet-ed above and cross-built in the cross-build job below).
      - name: Test internal/window (seam helpers; boundary excluded from gate)
        run: go test ./internal/window/...
      - name: Test with coverage (all packages except the window boundary)
        run: go test -covermode=set -coverprofile=cover.out $(go list ./... | grep -vE '/internal/window($|/)')
      - name: Enforce 100% coverage
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 < 100.0) ? 1 : 0 }' \
            || { echo "coverage ${pct}% < 100%"; go tool cover -func=cover.out | grep -v '100.0%'; exit 1; }

  race:
    # The native-window front-end aggregates on a background goroutine while the
    # render thread draws; the scene-write marshaling (app.App.DeferSceneWrites)
    # keeps that data-race-free. Guard it so it can't regress. -race needs the
    # race runtime, which requires cgo, so this job runs with CGO enabled on
    # linux/amd64 (the coverage gate above stays CGO=0, since -race is
    # incompatible with -covermode=set). The window boundary is excluded here as
    # in the coverage gate.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Test with the race detector (all packages except the window boundary)
        run: go test -race $(go list ./... | grep -vE '/internal/window($|/)')

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./...
