version: '3'

env:
  CGO_ENABLED: '0'
  GOWORK: 'off'

tasks:
  run:
    desc: Launch the native aggregator window (macOS / Windows / Linux)
    # -tags tray_native links the macOS menu-bar (NSStatusItem) tray backend;
    # without it the app still runs and shows its dock icon, just no tray.
    cmds:
      - 'go run -tags tray_native ./cmd/newsreader -window -sub reddit:golang -sub hackernews: {{.CLI_ARGS}}'

  serve:
    desc: Serve a read-only PNG view over HTTP (default :8080)
    cmds:
      - 'go run ./cmd/newsreader -serve {{.ADDR | default ":8080"}} -sub reddit:golang {{.CLI_ARGS}}'

  png:
    desc: Render the merged feed to feed.png
    cmds:
      - 'go run ./cmd/newsreader -o feed.png -sub reddit:golang {{.CLI_ARGS}}'

  json:
    desc: Print the merged feed as JSON
    cmds:
      - 'go run ./cmd/newsreader -json -sub reddit:golang {{.CLI_ARGS}}'

  build:
    desc: Build the newsreader binary into ./bin (with the macOS tray backend)
    cmds:
      - go build -tags tray_native -o bin/newsreader ./cmd/newsreader

  test:
    desc: Run tests (100% gate on every package except the native-window boundary)
    cmds:
      - go test ./internal/window/...
      - 'go test -covermode=set -coverprofile=cover.out $(go list ./... | grep -vE "/internal/window($|/)")'
      - "go tool cover -func=cover.out | awk '/^total:/{print \"coverage:\",$3}'"

  usenet-free:
    desc: 'Legacy binary target — download+decode a real PAR2 from Free (news.free.fr:119, no auth)'
    cmds:
      - 'go test -tags nntpnet -run TestFreeLegacyPAR2 ./provider/usenet/ -v'
    env:
      NNTP_LEGACY_ADDR: '{{.NNTP_LEGACY_ADDR | default "news.free.fr:119"}}'
      NNTP_LEGACY_GROUP: '{{.NNTP_LEGACY_GROUP | default "alt.binaries.test"}}'

  usenet-modern:
    desc: 'Modern text target — Eternal-September over TLS+AUTHINFO (set NNTP_MODERN_USER / NNTP_MODERN_PASS)'
    cmds:
      - 'go test -tags nntpnet -run TestModernText ./provider/usenet/ -v'

  usenet-binary:
    desc: 'Modern binary target — XSUsenet/any TLS+AUTHINFO (set NNTP_BIN_ADDR / NNTP_BIN_USER / NNTP_BIN_PASS)'
    cmds:
      - 'go test -tags nntpnet -run TestModernBinary ./provider/usenet/ -v'
